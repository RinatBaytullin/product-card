<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Первая работа</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="products__content">
    <div class="controls">
      <button class="controls__button button" id="change-color-all-card">Сменить цвет всех карточек</button>
      <button class="controls__button button" id="change-color-first-card">Сменить цвет первой карточки</button>
      <button class="controls__button button button--google" id="open-google">Открыть страницу Google.com</button>
      <button class="controls__button button" id="output-console-log">Вывести сообщение в консоль лог</button>
      <button class="controls__button button button--active" id="change-button-color">Сменить цвет кнопки</button>
    </div>
    <section class="products">
      <h1 class="products__title">Выбери свой продукт</h1>
      <ul class="products__list" id="product-list"></ul>
    </section>
  </div> 
  <template id="product-template">
    <li class="product-card">
      <img class="product-card__image" src="" alt="" width="290" height="245" />
      <p class="product-card__label"></p>
      <h2 class="product-card__title"></h2>
      <p class="product-card__description"></p>
      <span>Состав:</span>
      <ul class="product-card__components"></ul>
      <div class="product-card__price">
        <b>Цена</b>
        <span class="product-card__price-value"></span>
      </div>
      <button class="product-card__button button button--buy">
        <img class="button__icon" src="images/button_plus.svg" width="16" height="16">
        <span class="button__text">Купить</span>
      </button>
    </li>
  </template>
  <!-- <script src="main.js"></script>   -->
  <!-- <script src="homework-7.js"></script> -->
  <!-- <script src="homework-8.js"></script> -->
  <!--<script type="module" src="homework-9.js"></script>-->
  <script type="module" src="homework-10.js"></script>
</body>
</html>
